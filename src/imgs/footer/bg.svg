<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 680" width="1280" height="680" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="topGlow" cx="50%" cy="0%" r="50%" fx="50%" fy="0%">
      <stop offset="0%" stop-color="#2f6bff" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#1c3f9e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#111111" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f6bff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5b8cff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2f6bff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base -->
  <rect width="1280" height="680" fill="#111111"/>

  <!-- Top blue glow -->
  <ellipse cx="640" cy="0" rx="500" ry="60" fill="url(#topGlow)"/>
  <rect x="0" y="0" width="1280" height="2" fill="url(#topLine)"/>

  <!-- Large faint ring, bottom-left -->
  <circle cx="155" cy="685" r="340" fill="none" stroke="#1d1d1d" stroke-width="68"/>

  <!-- Large faint ring, bottom-right -->
  <circle cx="1245" cy="740" r="265" fill="none" stroke="#1d1d1d" stroke-width="53"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
